<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="" />
    <meta name="theme-color" content="#059669" />
    <title>Asia Green Tech</title>

    <!-- Prevent theme flash -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("agt-theme");
          var dark =
            stored === "dark" ||
            (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;600;700&family=Sora:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --font-sans: "Manrope", ui-sans-serif, system-ui, sans-serif;
        --font-display: "Sora", "Manrope", ui-sans-serif, system-ui, sans-serif;
        --color-brand-50: #ecfdf5;
        --color-brand-100: #d1fae5;
        --color-brand-200: #a7f3d0;
        --color-brand-300: #6ee7b7;
        --color-brand-400: #34d399;
        --color-brand-500: #10b981;
        --color-brand-600: #059669;
        --color-brand-700: #047857;
        --color-brand-800: #065f46;
        --color-brand-900: #064e3b;
      }
    </style>

    <link rel="stylesheet" href="css/styles.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23059669'/%3E%3Cpath d='M8 20c4-8 12-10 16-12-2 6-4 12-8 14-3 1.5-6 0-8-2z' fill='%23a7f3d0'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div class="page-shell">
      <div class="hero-plane" aria-hidden="true"></div>

      <div class="site-content">
        <header class="site-header">
          <div class="nav-inner">
            <a class="brand-link" href="./" aria-label="Asia Green Tech">
              <span class="brand-badge" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path
                    d="M5 16c3.5-7 10-9 14-11-1.5 5.5-3.5 10.5-7 12.5C9.5 18.5 6.5 17 5 16Z"
                    fill="currentColor"
                  />
                  <path
                    d="M8 18c2 .8 4.2.6 6-.4"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                    opacity="0.7"
                  />
                </svg>
              </span>
              <span class="brand-mark" data-i18n="home.brand">Asia Green Tech</span>
            </a>

            <div class="nav-actions">
              <label class="sr-only" for="lang-select" data-i18n="nav.language"
                >Language</label
              >
              <select
                id="lang-select"
                class="lang-select"
                data-i18n-aria-label="nav.language"
                aria-label="Language"
              >
                <option value="en">English</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
                <option value="it">Italiano</option>
                <option value="es">Español</option>
                <option value="pt">Português</option>
                <option value="ru">Русский</option>
                <option value="ar">العربية</option>
                <option value="hi">हिन्दी</option>
              </select>

              <button
                id="theme-toggle"
                class="control-btn"
                type="button"
                data-i18n-aria-label="theme.toggle"
                aria-label="Toggle theme"
                aria-pressed="false"
              >
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path
                    d="M17.5 14.5A7.5 7.5 0 0 1 9.5 6.5 6.5 6.5 0 1 0 17.5 14.5Z"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.7" />
                  <path
                    d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                  />
                </svg>
                <span class="theme-label" data-i18n="theme.toggle">Theme</span>
              </button>
            </div>
          </div>
        </header>

        <main>
          <section class="hero" aria-labelledby="brand-hero">
            <div class="hero-inner">
              <div class="hero-copy">
                <h1 id="brand-hero" class="brand-hero reveal" data-i18n="home.brand">
                  Asia Green Tech
                </h1>
                <p class="hero-title reveal reveal-delay-1" data-i18n="home.title">
                  Clean technology for a regenerative future
                </p>
                <p class="hero-subtitle reveal reveal-delay-2" data-i18n="home.subtitle">
                  We design and deliver sustainable innovation across Asia — bridging
                  nature, engineering, and intelligent systems.
                </p>
                <div class="cta-group reveal reveal-delay-3">
                  <a class="btn btn-primary" href="#contact" data-i18n="home.cta_primary"
                    >Explore solutions</a
                  >
                  <a class="btn btn-secondary" href="#about" data-i18n="home.cta_secondary"
                    >Our mission</a
                  >
                </div>
              </div>
            </div>
          </section>
        </main>

        <footer class="site-footer" id="about">
          <div class="footer-inner">
            <p class="footer-tagline" data-i18n="footer.tagline">
              Asia Green Technology
            </p>
            <p data-i18n="footer.rights">
              © 2026 Asia Green Tech. All rights reserved.
            </p>
          </div>
        </footer>

        <!-- Anchor target for primary CTA (placeholder until Contact page exists) -->
        <div id="contact" hidden aria-hidden="true"></div>
      </div>
    </div>

    <script src="js/theme.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
